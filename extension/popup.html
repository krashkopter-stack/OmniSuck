<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  :root{color-scheme:dark}
  html{background:#141416}
  body{font:14px -apple-system,system-ui,sans-serif;width:270px;margin:0;padding:16px;background:#141416;color:#ececf1}
  button{width:100%;padding:13px;border:0;border-radius:14px;font-size:15px;cursor:pointer;margin-bottom:10px;transition:.15s}
  #dl{background:#e53935;color:#fff;font-weight:600}
  #dl:hover{background:#f04b47}
  #dl:disabled{opacity:.55}
  #set{background:#232327;color:#ececf1}
  #set:hover{background:#2d2d32}
  #settings{background:#1d1d21;border-radius:16px;padding:6px 12px 12px;margin-bottom:10px}
  label{display:block;margin:10px 0 5px;color:#9a9aa3;font-size:12px}
  select{width:100%;padding:9px 10px;border:1px solid #33333a;border-radius:11px;font-size:13px;background:#26262b;color:#ececf1}
  #folder{background:#26262b;color:#ececf1;border:1px solid #33333a;border-radius:11px;padding:9px 10px;font-size:13px;text-align:left;margin:0;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #folder:hover{border-color:#e53935}
  button{display:flex;align-items:center;justify-content:center;gap:8px}
  #folder{justify-content:flex-start}
  #folder span{overflow:hidden;text-overflow:ellipsis}
  svg{flex:none}
  #status{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:#b8b8c0;text-align:center;word-break:break-word}
  #status:empty{display:none}
  .spin{width:38px;height:38px;animation:r 1s linear infinite}
  .spin circle{stroke:#e53935;stroke-linecap:round;stroke-dasharray:70 100}
  @keyframes r{to{transform:rotate(360deg)}}
  .mark{width:40px;height:40px}
  .mark path{stroke-dasharray:40;stroke-dashoffset:40;animation:d .45s .1s ease-out forwards}
  .bar{width:100%;height:6px;border-radius:6px;background:#2a2a30;overflow:hidden}
  .bar i{display:block;height:100%;background:#e53935;border-radius:6px;transition:width .3s}
  @keyframes d{to{stroke-dashoffset:0}}
</style></head>
<body>
  <button id="dl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Скачать</button>
  <button id="set"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
  <div id="settings" hidden>
    <label>Качество видео</label>
    <select id="quality">
      <option value="best">Максимальное</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
    </select>
    <label>Что скачивать</label>
    <select id="format">
      <option value="video">Видео (MP4)</option>
      <option value="audio">Только звук (MP3)</option>
    </select>
    <label>Папка для сохранения (нажмите, чтобы выбрать)</label>
    <button id="folder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e53935" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="fname"></span></button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body></html>
